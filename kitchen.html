<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bếp - Quản Lý Chế Biến Phở</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #212529; color: #f8f9fa; }
        .card-order { background-color: #343a40; border: 2px solid #ffc107; border-radius: 10px; }
        .badge-paid { background-color: #198754; font-size: 0.9rem; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <h2>👨‍🍳 Màn Hình Bếp - Danh Sách Chế Biến (Real-time)</h2>
            <span class="badge bg-danger fs-6" id="statusIndicator">Đang kết nối...</span>
        </div>

        <div id="ordersContainer" class="row g-3">
            <!-- Đơn hàng sẽ tự động nạp vào đây -->
        </div>
    </div>

    <script>
        const API_BASE = "https://fn-order-vugiakhoi-btbzhyd6h6ahc7bw.southeastasia-01.azurewebsites.net/api";

        async function fetchOrders() {
            try {
                const res = await fetch(`${API_BASE}/GetOrders`);
                if (!res.ok) throw new Error("Lỗi gọi API");
                
                const orders = await res.json();
                document.getElementById('statusIndicator').className = "badge bg-success fs-6";
                document.getElementById('statusIndicator').innerText = "Hệ thống hoạt động";

                const container = document.getElementById('ordersContainer');
                container.innerHTML = '';

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <h4 class="text-muted">Hiện chưa có đơn phở mới nào cần nấu.</h4>
                        </div>`;
                    return;
                }

                orders.forEach(order => {
                    const timeFormatted = new Date(order.createdAt).toLocaleTimeString('vi-VN');
                    container.innerHTML += `
                        <div class="col-md-4 col-lg-3" id="card-${order.id}">
                            <div class="card card-order text-white h-100">
                                <div class="card-header d-flex justify-content-between align-items-center border-warning">
                                    <span class="fw-bold">${timeFormatted}</span>
                                    <span class="badge badge-paid">Đã TT</span>
                                </div>
                                <div class="card-body">
                                    <h4 class="card-title text-warning mb-3">${order.dish}</h4>
                                    <p class="card-text mb-1">Khách: <strong>${order.customerName}</strong></p>
                                    <p class="card-text mb-2"><small class="text-muted">Mã: ${order.id}</small></p>
                                    <p class="card-text">Trạng thái: <span class="badge bg-info text-dark">${order.status}</span></p>
                                </div>
                                <div class="card-footer border-top-0 bg-transparent">
                                    <button onclick="markCompleted('${order.id}')" class="btn btn-success w-100 fw-bold py-2">
                                        ✅ ĐÃ XONG (GIAO MÓN)
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Lỗi cập nhật danh sách đơn:", err);
                document.getElementById('statusIndicator').className = "badge bg-danger fs-6";
                document.getElementById('statusIndicator').innerText = "Mất kết nối API";
            }
        }

        async function markCompleted(orderId) {
            try {
                const res = await fetch(`${API_BASE}/UpdateOrderStatus`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderId, status: "Completed" })
                });

                if (res.ok) {
                    // Xóa thẻ khỏi giao diện ngay lập tức
                    const card = document.getElementById(`card-${orderId}`);
                    if (card) card.remove();
                    fetchOrders();
                } else {
                    alert("Cập nhật thất bại.");
                }
            } catch (err) {
                alert("Lỗi kết nối khi cập nhật đơn hàng.");
            }
        }

        // Tự động kiểm tra đơn hàng mới mỗi 3 giây
        setInterval(fetchOrders, 3000);
        fetchOrders();
    </script>
</body>
</html>
