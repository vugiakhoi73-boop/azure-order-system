<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bếp - Quản Lý Chế Biến Phở</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529; /* Nền tối cho màn hình bếp */
            color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #495057;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .order-card {
            background-color: #2c3034;
            border: 1px solid #ffc107; /* Viền vàng nổi bật */
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #495057;
            padding: 10px 15px;
            font-weight: bold;
        }
        .order-body {
            padding: 15px;
        }
        .btn-complete {
            background-color: #198754;
            color: white;
            border: none;
            transition: 0.2s;
        }
        .btn-complete:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Tiêu đề trang -->
        <div class="header-container">
            <h2>🧑‍🍳 Màn Hình Bếp - Danh Sách Chế Biến (Real-time)</h2>
            <span class="badge bg-success fs-6">Hệ thống hoạt động</span>
        </div>
        
        <!-- Khu vực chứa lưới đơn hàng -->
        <div class="row" id="ordersContainer">
            <div class="col-12 text-center text-muted mt-5" id="loadingMsg">
                <h4>Đang tải dữ liệu đơn hàng...</h4>
            </div>
        </div>
    </div>

    <script>
        // Đường dẫn API Azure Function của bạn
        const API_BASE = "https://fn-order-vugiakhoi-btbzhyd6h6ahc7bw.southeastasia-01.azurewebsites.net/api";
        
        // Khai báo biến toàn cục để lưu trữ toàn bộ dữ liệu đơn hàng
        let currentPendingOrders = [];
        
        // Hàm gọi API lấy danh sách đơn hàng
        async function fetchOrders() {
            try {
                const response = await fetch(`${API_BASE}/GetOrders`);
                if (response.ok) {
                    const orders = await response.json();
                    renderOrders(orders);
                }
            } catch (error) {
                console.error("Lỗi khi tải đơn hàng:", error);
            }
        }

        // Hàm vẽ đơn hàng ra giao diện
        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            
            // Lọc và lưu toàn bộ dữ liệu vào biến toàn cục
            currentPendingOrders = orders.filter(o => o.status === 'Pending');

            if (currentPendingOrders.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted mt-5"><h4>Chưa có đơn hàng nào cần chế biến.</h4></div>';
                return;
            }

            container.innerHTML = ''; // Xóa thông báo loading

            // Duyệt qua từng đơn hàng và tạo thẻ HTML
            currentPendingOrders.forEach(order => {
                const col = document.createElement('div');
                col.className = 'col-md-4 col-lg-3';
                
                // Định dạng thời gian
                const orderDate = new Date(order.createdAt || Date.now());
                const timeString = orderDate.toLocaleTimeString('vi-VN');

                // Kiểm tra xem khách có nhập SĐT và Địa chỉ không
                const phoneStr = order.customerPhone ? `<p class="mb-1 text-light">SĐT: <strong>${order.customerPhone}</strong></p>` : '';
                const addressStr = order.customerAddress ? `<p class="mb-1 text-light">Đ/c: <strong>${order.customerAddress}</strong></p>` : '';

                col.innerHTML = `
                    <div class="order-card">
                        <div class="order-header">
                            <span>${timeString}</span>
                            <span class="badge bg-success">Đã TT</span>
                        </div>
                        <div class="order-body">
                            <h4 class="text-warning mb-3">${order.dish}</h4>
                            <p class="mb-1 text-light">Khách: <strong>${order.customerName}</strong></p>
                            ${phoneStr}
                            ${addressStr}
                            <p class="text-muted small mb-2 mt-2">Mã: ${order.id || order.orderId}</p>
                            <p class="mb-3">Trạng thái: <span class="badge bg-info text-dark">Pending</span></p>
                            
                            <button class="btn btn-complete w-100 fw-bold py-2" onclick="completeOrder('${order.id || order.orderId}')">
                                ☑ ĐÃ XONG (GIAO MÓN)
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        // Hàm cập nhật trạng thái đơn hàng khi làm xong
        async function completeOrder(orderId) {
            // Lấy nguyên 1 cục dữ liệu của đơn hàng dựa trên ID
            const orderData = currentPendingOrders.find(o => o.id === orderId || o.orderId === orderId);
            if (!orderData) return;
            
            // Đổi trạng thái thành Completed
            orderData.status = 'Completed'; 

            try {
                const response = await fetch(`${API_BASE}/UpdateOrder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData) // Gửi đi TOÀN BỘ dữ liệu để không bị mất thông tin
                });
                
                if (response.ok) {
                    fetchOrders(); // Làm mới lại màn hình ngay lập tức
                } else {
                    alert("Lỗi khi cập nhật trạng thái đơn hàng!");
                }
            } catch (error) {
                console.error("Lỗi:", error);
            }
        }

        // Kỹ thuật Polling: Tự động gọi API làm mới danh sách mỗi 3 giây
        setInterval(fetchOrders, 3000);
        
        // Gọi lần đầu khi vừa mở trang
        fetchOrders();
    </script>
</body>
</html>
